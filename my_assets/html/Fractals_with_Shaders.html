<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Fractal Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css">
  <style>
    /* make page fill window and remove scrollbars */
    html, body { margin: 0; height: 100vh; overflow: hidden; }

    /* global font reset */
    body{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.4}

    /* flex container: left is canvas, right is UI */
    #app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    #left {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }

    .square {
      width: 100%;
      position: relative;
    }
    
    .square::before {
      content: "";
      display: block;
      padding-top: 100%; 
    }

    .square > canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #dragbar{
      width:6px; cursor:col-resize;
      background:linear-gradient(to bottom,#666 25%,#999 25%,#999 75%,#666 75%);
      margin: 0 0.25 rem;
    }
    /* #dragbar:hover { background:#555; } */

    /* UI panel on the right */
    #ui {
      flex: 1;
      width: 50%;
      box-sizing: border-box;
      padding: 16px;
      background: #f0f0f0;
      overflow-y: auto;
      align-items: center; /* ?? */
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT column -->
    <div id="left">
      <div class="square">
        <canvas id="glcanvas"></canvas>
      </div>
    </div>

    <!-- divider -->
    <div id="dragbar"></div>   

    <!-- RIGHT colunn -->
    <div id="ui">
      <label for="fractal">Choose fractal:</label>
      <p id="status"></p>
      <select id="fractal">
        <option value="0">Mandelbrot</option>
        <option value="1">Julia</option>
        <option value="2">Fatou</option>
        <option value="3">Burning Ship</option>
        <option value="4">Tricorn</option>
        <option value="5">Newton's Method on z³–1</option>
      </select>

      <div style="margin-top:1em">
        <small>Drag the dot to pick <em>c</em>:</small><br>
        <canvas id="picker" width="200" height="200"
                style="border:1px solid #ccc; cursor: crosshair;">
        </canvas>
      </div>

      <div style="margin-top:1em">
        <button id="resetBtn" title="reset zoom & parameter"
                style="background:#fff;border:1px solid #666;
                       padding:4px 8px;border-radius:4px;cursor:pointer">
          🔄 Reset
        </button>
      </div>

      <div style="margin-top:1em">
        <label for="iterSlider">Max Iterations:</label>
        <input id="iterSlider" type="range" min="0" max="1000" step="1" value="100">
        <span id="iterValue">50</span>
      </div>

      <div style="margin-top:1em">
        <label for="BSlider">Boundedness Threshold:</label>
        <input id="BSlider" type="range" min="0" max="10" step="0.1" value="4">
        <span id="BValue">4.0</span>
      </div>

      <hr style="margin:1.5em 0">

      <!-- buttons -->
      <button id="downloadBtn"
              style="margin-right:8px;padding:4px 10px;border:1px solid #444;
                    border-radius:4px;cursor:pointer">
        💾 Download PNG
      </button>

      <!-- keyboard / mouse help -->
      <div id="help" style="font-size:12px;margin-top:1em;line-height:1.4">
        <strong>Navigation:</strong><br>
        • <kbd>Mouse wheel</kbd> or <kbd>+ / –</kbd> zoom<br>
        • <kbd>Click</kbd> (zoom in)  <kbd>Shift+Click</kbd> (zoom out)<br>
        • <kbd>Drag</kbd> pan view<br>
        • <kbd>← ↑ → ↓</kbd> pan 10% per keypress<br>
      </div>
    </div>
  </div>

  <script type="module" src="/my_assets/js/fractals.js"></script>
</body>
</html>
